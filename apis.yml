description: 'Proxy (Y Combinator, Summer 2016) was a San Francisco digital-identity
  startup founded by Denis Mars and Simon Ratner that built a mobile and wearable
  digital wallet for payments, identity, and authentication, later expanding into
  biometric identity verification and vaccine-credential verification. The company
  was acquired by OURA in 2023; the proxy.com domain no longer resolves to an active
  product and there is no public developer platform, API, or documentation surface
  to enrich. This profile is retained as a historical/acquired-company record.'
